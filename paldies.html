<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paldies – Grantu Radars</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Inter";src:url(fonts/inter-400.woff) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"Inter Display";src:url(fonts/interdisplay-800.woff) format("woff");font-weight:800;font-display:swap}
:root{--bg:#F4F6F9;--ink:#16212D;--muted:#566475;--go:#1D7A50;--go-fg:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0C1622;--ink:#E5ECF4;--muted:#9AAABB;--go:#3FBF86;--go-fg:#05150D;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:17px/1.6 "Inter",system-ui,sans-serif;padding:24px}
main{max-width:520px;display:grid;gap:16px;text-align:center;justify-items:center}
h1{font:800 clamp(30px,6vw,42px)/1.1 "Inter Display","Inter",sans-serif;margin:0;letter-spacing:-.02em}
p{color:var(--muted);margin:0}
a{display:inline-flex;align-items:center;min-height:48px;padding:0 20px;border-radius:12px;background:var(--go);color:var(--go-fg);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<main>
<h1>Paldies!</h1>
<p>Tavs programmu saraksts ir saņemts. Mēs to nosūtīsim uz tavu e-pastu vienas darba dienas laikā.</p>
<a href="/">Atpakaļ uz sākumu</a>
</main>
</body>
</html>
