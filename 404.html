<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lapa nav atrasta – Grantu Radars</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#F4F6F9;--ink:#16212D;--muted:#566475;--go:#1D7A50;--go-fg:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0C1622;--ink:#E5ECF4;--muted:#9AAABB;--go:#3FBF86;--go-fg:#05150D;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px;text-align:center}
h1{font-size:34px;margin:0 0 8px}
p{color:var(--muted);margin:0 0 20px}
a{display:inline-flex;align-items:center;min-height:48px;padding:0 20px;border-radius:12px;background:var(--go);color:var(--go-fg);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<main><h1>Šī lapa nav atrasta</h1><p>Iespējams, saite ir mainījusies.</p><a href="/">Uz sākumu</a></main>

</html>
